# Polymarket Trading Bot Configuration

# API Configuration
api:
  # Polymarket CLOB API endpoints
  rest_endpoint: "https://clob.polymarket.com"
  websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"

  # Authentication - Fill these in directly or use the setup script
  api_key: ""
  api_secret: ""
  passphrase: ""

  # Your EOA wallet private key (with or without the 0x prefix)
  # WARNING: Keep this secure! Never commit this file with real keys
  private_key: "your_private_key_here"

  # Which wallet holds your funds, and how the key signs for it:
  #   0 = the private key's own address (EOA)
  #   1 = Polymarket proxy wallet (email/magic login)
  #   2 = Polymarket Gnosis Safe (browser wallet login)
  #   3 = deposit wallet (smart contract wallet)
  # For 1-3, set funder_address to the wallet shown on polymarket.com
  # (your profile address), not the key's address.
  # scripts/setup_credentials.py detects and fills in both for you.
  signature_type: 0
  funder_address: ""

  # Account feed (order and fill updates) and positions API for live trading
  user_websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
  data_api_url: "https://data-api.polymarket.com"
  gamma_api_url: "https://gamma-api.polymarket.com"  # resolves market links

  # HTTP client tuning
  timeout_ms: 2000
  keepalive_enabled: true
  max_idle_conns: 10
  max_conns_per_host: 10

# Markets to monitor and trade
markets:
  # List of market IDs to subscribe to
  target_market_ids:
    # polymarket.com market links (add #Outcome to trade one side), or CLOB token IDs
    - "https://polymarket.com/event/xi-jinping-out-before-2027#Yes"  # Example only: use your own market

  # Minimum liquidity required (in USD) to consider a market
  min_liquidity: 10000

# Trading Strategy Parameters
strategy:
  # Threshold-based strategy
  buy_below: 0.45        # Buy when price drops below this
  sell_above: 0.55       # Sell when price rises above this

  # Position sizing
  quantity: 100          # Number of contracts per order
  max_position_size: 500 # Maximum total position across all markets

  # Slippage protection
  max_slippage_pct: 0.5  # Maximum allowed slippage (%)

  # Strategy mode: "threshold", "market_making", "momentum"
  mode: "threshold"

# Order Management
orders:
  # Rate limiting
  max_orders_per_second: 5
  max_orders_per_minute: 100

  # Order batching (set to 1 to disable batching)
  batch_size: 1
  batch_interval_ms: 100

  # Order type: "GTC" (rests until filled or cancelled), "FAK" (fill what you
  # can now, cancel the rest; "IOC" is accepted as an alias), "FOK" (all or nothing)
  default_order_type: "GTC"

  # Maximum outstanding orders at any time
  max_outstanding: 10

  # Retry configuration
  max_retries: 3
  retry_delay_ms: 500

# Risk Management
risk:
  # Maximum daily loss (in USD)
  max_daily_loss: 1000

  # Maximum loss per trade (in USD)
  max_loss_per_trade: 100

  # Stop trading if daily loss exceeds threshold
  auto_halt_on_loss: true

  # Maximum exposure per market (in USD)
  max_exposure_per_market: 5000

# WebSocket Configuration
websocket:
  # Buffer sizes (tune for low latency)
  read_buffer_size: 8192
  write_buffer_size: 8192

  # Ping/pong for connection health
  ping_interval_sec: 30
  pong_timeout_sec: 10

  # Reconnection settings
  reconnect_enabled: true
  reconnect_max_attempts: 10
  reconnect_delay_sec: 5

  # Message handling
  message_buffer_size: 1000  # Bounded channel size

# Performance Tuning
performance:
  # Goroutine count for order processing
  worker_count: 4

  # GC tuning (GOGC environment variable)
  gc_percent: 100

  # CPU affinity (leave empty for no pinning)
  cpu_cores: []  # e.g., [0, 1, 2, 3]

  # Object pool sizes
  struct_pool_size: 1000

# Monitoring & Metrics
monitoring:
  # Enable metrics collection
  enabled: true

  # Metrics export port (Prometheus-compatible)
  metrics_port: 9090

  # Latency tracking
  track_latency: true

  # Auto-halt conditions
  max_latency_ms: 100        # Halt if latency exceeds this
  max_error_rate_pct: 5.0    # Halt if error rate exceeds this (%)

  # Logging
  log_level: "info"          # debug, info, warn, error
  log_format: "json"         # json or text

# Paper Trading (simulated - no real money)
# When enabled, the bot uses live Polymarket prices but NEVER sends orders.
# Fills are simulated instantly at the signal price against a virtual balance,
# so you need no funds, no API credentials and no private key.
# Set enabled: false only when you are ready to trade real money.
paper_trading:
  enabled: true
  starting_balance: 1000     # Virtual USDC
  report_interval_sec: 60    # How often to log the paper portfolio
  state_file: "data/paper_state.json"  # Portfolio is saved here and restored on startup

# Live Trading (used when paper_trading.enabled is false)
live_trading:
  journal_file: "data/live_trades.jsonl"  # Every live fill, appended as it happens

# Key Management
security:
  # Use vault for key storage
  use_vault: false
  vault_endpoint: ""
  vault_token: ""

  # Remote signer endpoint (optional)
  remote_signer_enabled: false
  remote_signer_url: ""

# Deployment
deployment:
  # Target region for lowest RTT
  region: "us-east-1"

  # Environment: "development", "staging", "production"
  environment: "development"
